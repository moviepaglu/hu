<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎬 Movie Download Hub</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family: system-ui, Arial, sans-serif; }
  body { background: linear-gradient(145deg, #0f172a, #1e293b); min-height:100vh; padding:20px; color:#e2e8f0; }
  .container { max-width: 1200px; margin:0 auto; }

  .header {
    text-align:center; margin-bottom:30px; padding:32px 20px;
    background: rgba(30,41,59,0.7); border-radius:24px;
    border:1px solid #334155;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    position: relative; overflow: hidden;
  }
  .header::before {
    content:''; position:absolute; top:-50%; left:-50%; width:200%; height:200%;
    background: radial-gradient(circle, rgba(56,189,248,0.15) 0%, transparent 60%);
    animation: pulse 4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100% { transform: scale(1); opacity: 0.5; }
    50% { transform: scale(1.1); opacity: 0.8; }
  }
  .header h1 {
    font-size:34px; position:relative;
    background: linear-gradient(135deg, #38bdf8, #a78bfa, #f472b6);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    font-weight: 800;
  }
  .header .sub { color:#94a3b8; font-size:14px; margin-top:10px; position:relative; }

  /* ---------- Search & Filters ---------- */
  .search-bar { max-width: 500px; margin: 20px auto 0; position: relative; }
  .search-bar input {
    width:100%; padding: 13px 45px 13px 45px;
    border-radius: 12px; border: 2px solid #334155;
    background: #0f172a; color: #fff; font-size: 14px;
    outline: none; transition: 0.2s;
  }
  .search-bar input:focus { border-color: #38bdf8; box-shadow: 0 0 0 3px rgba(56,189,248,0.2); }
  .search-bar::before {
    content: '🔍'; position: absolute; left: 15px; top: 50%;
    transform: translateY(-50%); font-size: 16px; pointer-events: none;
  }
  .clear-search {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    background: #334155; border: none; color: #94a3b8; cursor: pointer;
    width: 24px; height: 24px; border-radius: 50%; font-size: 12px;
    display: none; align-items: center; justify-content: center;
    transition: 0.2s;
  }
  .clear-search:hover { background: #475569; color: #fff; }
  .clear-search.show { display: flex; }

  /* ---------- Filter Bar ---------- */
  .filter-bar {
    display: flex; flex-wrap: wrap; gap: 10px; justify-content: center;
    margin-top: 18px; position: relative;
  }
  .filter-bar select {
    padding: 10px 14px; border-radius: 10px;
    border: 2px solid #334155; background: #0f172a;
    color: #e2e8f0; font-size: 13px; font-weight: 600;
    outline: none; cursor: pointer; transition: 0.2s;
  }
  .filter-bar select:focus { border-color: #38bdf8; }
  .filter-bar select:hover { border-color: #475569; }

  .card {
    background: rgba(30,41,59,0.8); border-radius:24px;
    padding:28px; border:1px solid #334155;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  }
  .card-title {
    font-size: 20px; margin-bottom: 20px; color:#f1f5f9;
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; flex-wrap: wrap;
  }
  .card-title .left {
    display: flex; align-items: center; gap: 10px;
    border-left: 4px solid #38bdf8; padding-left: 12px;
  }
  .count-badge {
    background: linear-gradient(135deg, #38bdf8, #a78bfa);
    color:#fff; padding:4px 14px; border-radius:20px;
    font-size:12px; font-weight:700;
  }

  .movie-list {
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 20px;
  }

  .movie-item {
    background: #0f172a; border: 1px solid #334155;
    border-radius: 18px; overflow: hidden;
    transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex; flex-direction: column; cursor: pointer;
    position: relative;
  }
  .movie-item:hover {
    border-color: #38bdf8; transform: translateY(-8px);
    box-shadow: 0 25px 40px -15px rgba(56,189,248,0.3);
  }

  .poster-wrap {
    width:100%; aspect-ratio: 2/3;
    background: #1e293b; overflow: hidden; position: relative;
  }
  .poster-wrap img {
    width:100%; height:100%; object-fit: cover;
    display: block; transition: 0.4s;
  }
  .movie-item:hover .poster-wrap img { transform: scale(1.08); }
  .no-poster {
    width:100%; height:100%; display:flex; align-items:center;
    justify-content:center; font-size:60px; color:#475569;
  }

  .quality-float {
    position: absolute; top: 10px; right: 50px;
    background: rgba(6, 95, 70, 0.95);
    color: #6ee7b7; padding: 4px 10px;
    border-radius: 20px; font-size: 10px;
    font-weight: 800; letter-spacing: 0.5px;
    backdrop-filter: blur(4px);
    border: 1px solid rgba(110, 231, 183, 0.3);
  }

  /* ---------- Trending Badge ---------- */
  .trending-float {
    position: absolute; top: 10px; left: 10px;
    background: linear-gradient(135deg, #f59e0b, #ef4444);
    color: #fff; padding: 4px 10px;
    border-radius: 20px; font-size: 10px;
    font-weight: 800;
    box-shadow: 0 4px 12px rgba(239,68,68,0.4);
    animation: trendPulse 2s ease-in-out infinite;
  }
  @keyframes trendPulse {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }

  /* ---------- Favorite Button ---------- */
  .fav-btn {
    position: absolute; top: 10px; right: 10px;
    background: rgba(15,23,42,0.85);
    border: 1px solid #334155;
    width: 32px; height: 32px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 15px;
    transition: 0.2s; z-index: 2;
    backdrop-filter: blur(4px);
  }
  .fav-btn:hover { transform: scale(1.15); background: rgba(30,41,59,0.95); }
  .fav-btn.active { background: rgba(239,68,68,0.2); border-color: #ef4444; }

  .item-body { padding: 14px; flex:1; display: flex; flex-direction: column; }
  .item-name {
    font-weight: 700; color: #f1f5f9; font-size: 15px;
    margin-bottom: 10px; line-height: 1.3;
    display: -webkit-box; -webkit-line-clamp: 2;
    -webkit-box-orient: vertical; overflow: hidden;
    min-height: 40px;
  }

  .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .mini-badge { font-size: 10px; padding: 4px 10px; border-radius: 20px; font-weight: 700; }
  .badge-lang { background: #1e40af; color: #bfdbfe; }
  .badge-year { background: #7c2d12; color: #fed7aa; }
  .badge-rating { background: #713f12; color: #fde047; }

  .item-desc {
    font-size: 12px; color: #94a3b8; line-height: 1.5;
    margin-bottom: 14px; flex: 1;
    display: -webkit-box; -webkit-line-clamp: 3;
    -webkit-box-orient: vertical; overflow: hidden;
  }

  /* ---------- Download Button ---------- */
  .btn-download {
    background: linear-gradient(135deg, #10b981, #059669);
    color: #fff; border: none;
    padding: 12px 16px; border-radius: 12px;
    font-weight: 700; font-size: 14px;
    cursor: pointer; text-decoration: none;
    display: flex; align-items: center;
    justify-content: center; gap: 6px;
    transition: 0.2s; width: 100%;
  }
  .btn-download:hover { transform: scale(1.03); box-shadow: 0 10px 25px rgba(16,185,129,0.4); }
  .btn-download:active { transform: scale(0.98); }

  /* ---------- Stats Bar ---------- */
  .stats-bar {
    display: flex; gap: 12px; flex-wrap: wrap;
    margin-bottom: 20px; justify-content: center;
  }
  .stat-chip {
    background: rgba(15,23,42,0.6);
    border: 1px solid #334155;
    padding: 8px 16px; border-radius: 12px;
    font-size: 12px; font-weight: 600;
    color: #94a3b8;
    display: flex; align-items: center; gap: 6px;
  }
  .stat-chip strong { color: #38bdf8; }

  .empty, .loading {
    text-align: center; padding: 60px 20px;
    color: #64748b; font-size: 14px; grid-column: 1/-1;
  }
  .empty-icon { font-size: 64px; margin-bottom: 15px; display: block; opacity: 0.6; }
  .empty h3 { color: #cbd5e1; font-size: 18px; margin-bottom: 6px; font-weight: 600; }

  .footer {
    text-align: center; margin-top: 30px;
    font-size: 12px; color: #64748b;
    padding: 20px 0; border-top: 1px solid #334155;
  }

  .spinner {
    display: inline-block; width: 30px; height: 30px;
    border: 3px solid #334155; border-top-color: #38bdf8;
    border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- Toast ---------- */
  .toast {
    position: fixed; bottom: 30px; left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: linear-gradient(135deg, #10b981, #059669);
    color: #fff; padding: 14px 24px;
    border-radius: 12px; font-weight: 600; font-size: 14px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    opacity: 0; transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 9999; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ---------- Back to Top ---------- */
  .back-top {
    position: fixed; bottom: 25px; right: 25px;
    width: 48px; height: 48px; border-radius: 50%;
    background: linear-gradient(135deg, #38bdf8, #a78bfa);
    border: none; color: #fff; font-size: 20px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 10px 25px rgba(56,189,248,0.4);
    opacity: 0; transform: scale(0); transition: 0.3s;
    z-index: 999;
  }
  .back-top.show { opacity: 1; transform: scale(1); }
  .back-top:hover { transform: scale(1.1); }

  /* ---------- Skeleton Loading ---------- */
  .skeleton {
    background: #0f172a; border: 1px solid #334155;
    border-radius: 18px; overflow: hidden;
    animation: shimmer 1.5s infinite;
  }
  .skeleton-poster { width: 100%; aspect-ratio: 2/3; background: #1e293b; }
  .skeleton-body { padding: 14px; }
  .skeleton-line {
    height: 12px; background: #1e293b; border-radius: 6px;
    margin-bottom: 10px;
  }
  .skeleton-line.short { width: 60%; }
  .skeleton-line.btn { height: 38px; margin-top: 15px; }
  @keyframes shimmer {
    0%,100% { opacity: 0.6; }
    50% { opacity: 1; }
  }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: #0f172a; }
  ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
  ::-webkit-scrollbar-thumb:hover { background: #475569; }

  @media(max-width: 500px) {
    h1 { font-size: 24px !important; }
    .movie-list { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
    .card { padding: 18px; }
    .item-name { font-size: 13px; min-height: 34px; }
    .item-desc { font-size: 11px; -webkit-line-clamp: 2; }
    .btn-download { font-size: 12px; padding: 10px 12px; }
    .fav-btn { width: 28px; height: 28px; font-size: 13px; }
    .quality-float { font-size: 9px; padding: 3px 8px; right: 44px; }
  }
</style>
</head>
<body>

<div class="container">

  <div class="header">
    <h1>🎬 Movie Download Hub</h1>
    <p class="sub">Free HD movies · No login · Instant download</p>
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Search movie name, language, quality...">
      <button class="clear-search" id="clearSearch" title="Clear">✕</button>
    </div>

    <!-- Filter Bar -->
    <div class="filter-bar">
      <select id="filterLang">
        <option value="">🌐 All Languages</option>
      </select>
      <select id="filterQuality">
        <option value="">🎞️ All Qualities</option>
      </select>
      <select id="sortBy">
        <option value="newest">🆕 Newest First</option>
        <option value="oldest">📜 Oldest First</option>
        <option value="name">🔤 Name (A-Z)</option>
      </select>
    </div>
  </div>

  <div class="card">
    <div class="card-title">
      <div class="left">📥 Available Movies</div>
      <span class="count-badge" id="countBadge">0 Movies</span>
    </div>

    <!-- Stats Bar -->
    <div class="stats-bar" id="statsBar"></div>

    <div class="movie-list" id="movieList">
      <div class="skeleton">
        <div class="skeleton-poster"></div>
        <div class="skeleton-body">
          <div class="skeleton-line"></div>
          <div class="skeleton-line short"></div>
          <div class="skeleton-line btn"></div>
        </div>
      </div>
      <div class="skeleton">
        <div class="skeleton-poster"></div>
        <div class="skeleton-body">
          <div class="skeleton-line"></div>
          <div class="skeleton-line short"></div>
          <div class="skeleton-line btn"></div>
        </div>
      </div>
      <div class="skeleton">
        <div class="skeleton-poster"></div>
        <div class="skeleton-body">
          <div class="skeleton-line"></div>
          <div class="skeleton-line short"></div>
          <div class="skeleton-line btn"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="footer">⚡ Powered by Firebase · Live updates</div>

</div>

<!-- Back to Top -->
<button class="back-top" id="backTop" title="Back to top">↑</button>

<!-- Toast -->
<div class="toast" id="toast">✅ Done!</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, onValue }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  // 🔥 Firebase Config
  const firebaseConfig = {
    apiKey: "AIzaSyC6bvaho6e-55XSPeW92e6CMviuj6WCqA8",
    authDomain: "abod-df454.firebaseapp.com",
    databaseURL: "https://abod-df454-default-rtdb.firebaseio.com",
    projectId: "abod-df454",
    storageBucket: "abod-df454.firebasestorage.app",
    messagingSenderId: "962090759544",
    appId: "1:962090759544:web:2a0da10cf441a6f3ff848d",
    measurementId: "G-RGMRXYXNPM"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const moviesRef = ref(db, 'movies');

  let allMovies = [];
  let favorites = JSON.parse(localStorage.getItem('favMovies') || '[]');

  // ---------- Elements ----------
  const searchInput = document.getElementById('searchInput');
  const clearSearch = document.getElementById('clearSearch');
  const filterLang = document.getElementById('filterLang');
  const filterQuality = document.getElementById('filterQuality');
  const sortBy = document.getElementById('sortBy');
  const listDiv = document.getElementById('movieList');
  const countBadge = document.getElementById('countBadge');
  const statsBar = document.getElementById('statsBar');
  const backTop = document.getElementById('backTop');
  const toast = document.getElementById('toast');

  // ---------- Toast Helper ----------
  function showToast(msg, color) {
    toast.textContent = msg;
    if (color) toast.style.background = color;
    else toast.style.background = 'linear-gradient(135deg, #10b981, #059669)';
    toast.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => toast.classList.remove('show'), 2200);
  }

  // ---------- Search ----------
  searchInput.addEventListener('input', () => {
    clearSearch.classList.toggle('show', searchInput.value.length > 0);
    applyFilters();
  });

  clearSearch.addEventListener('click', () => {
    searchInput.value = '';
    clearSearch.classList.remove('show');
    applyFilters();
  });

  filterLang.addEventListener('change', applyFilters);
  filterQuality.addEventListener('change', applyFilters);
  sortBy.addEventListener('change', applyFilters);

  // ---------- Back to Top ----------
  window.addEventListener('scroll', () => {
    backTop.classList.toggle('show', window.scrollY > 400);
  });
  backTop.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

  // ---------- Realtime Listener ----------
  onValue(moviesRef, (snapshot) => {
    const data = snapshot.val();

    if (!data) {
      allMovies = [];
      countBadge.textContent = '0 Movies';
      statsBar.innerHTML = '';
      listDiv.innerHTML = `
        <div class="empty">
          <span class="empty-icon">🎞️</span>
          <h3>Abhi koi movie nahi hai</h3>
          <p>Thodi der baad check karo</p>
        </div>`;
      return;
    }

    allMovies = Object.entries(data)
      .map(([id, val]) => ({ id, ...val }))
      .sort((a, b) => (b.time || 0) - (a.time || 0));

    populateFilters();
    applyFilters();
  });

  // ---------- Populate Filters ----------
  function populateFilters() {
    const langs = [...new Set(allMovies.map(m => m.lang).filter(Boolean))];
    const qualities = [...new Set(allMovies.map(m => m.quality).filter(Boolean))];

    const currentLang = filterLang.value;
    const currentQuality = filterQuality.value;

    filterLang.innerHTML = '<option value="">🌐 All Languages</option>' +
      langs.map(l => `<option value="${escapeHtml(l)}">${escapeHtml(l)}</option>`).join('');

    filterQuality.innerHTML = '<option value="">🎞️ All Qualities</option>' +
      qualities.map(q => `<option value="${escapeHtml(q)}">${escapeHtml(q)}</option>`).join('');

    if (langs.includes(currentLang)) filterLang.value = currentLang;
    if (qualities.includes(currentQuality)) filterQuality.value = currentQuality;
  }

  // ---------- Apply All Filters ----------
  function applyFilters() {
    const query = searchInput.value.toLowerCase().trim();
    const lang = filterLang.value;
    const quality = filterQuality.value;
    const sort = sortBy.value;

    let filtered = allMovies.filter(m => {
      if (query) {
        const match = (m.name || '').toLowerCase().includes(query) ||
                      (m.lang || '').toLowerCase().includes(query) ||
                      (m.quality || '').toLowerCase().includes(query) ||
                      (m.desc || '').toLowerCase().includes(query);
        if (!match) return false;
      }
      if (lang && m.lang !== lang) return false;
      if (quality && m.quality !== quality) return false;
      return true;
    });

    // Sorting
    if (sort === 'newest') {
      filtered.sort((a, b) => (b.time || 0) - (a.time || 0));
    } else if (sort === 'oldest') {
      filtered.sort((a, b) => (a.time || 0) - (b.time || 0));
    } else if (sort === 'name') {
      filtered.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
    }

    // Favorites first
    filtered.sort((a, b) => {
      const aFav = favorites.includes(a.id) ? 1 : 0;
      const bFav = favorites.includes(b.id) ? 1 : 0;
      return bFav - aFav;
    });

    updateStats(filtered);
    renderMovies(filtered);
  }

  // ---------- Stats Bar ----------
  function updateStats(movies) {
    const total = movies.length;
    const favCount = movies.filter(m => favorites.includes(m.id)).length;
    const langs = new Set(movies.map(m => m.lang).filter(Boolean)).size;

    statsBar.innerHTML = `
      <div class="stat-chip">🎬 Total: <strong>${total}</strong></div>
      <div class="stat-chip">❤️ Favorites: <strong>${favCount}</strong></div>
      <div class="stat-chip">🌐 Languages: <strong>${langs}</strong></div>
    `;
  }

  // ---------- Render Movies ----------
  function renderMovies(movies) {
    countBadge.textContent = movies.length + ' Movie' + (movies.length !== 1 ? 's' : '');

    if (movies.length === 0) {
      listDiv.innerHTML = `
        <div class="empty">
          <span class="empty-icon">🔍</span>
          <h3>Koi movie nahi mili</h3>
          <p>Filter ya search change karke try karo</p>
        </div>`;
      return;
    }

    listDiv.innerHTML = '';
    movies.forEach(m => {
      const div = document.createElement('div');
      div.className = 'movie-item';

      const isFav = favorites.includes(m.id);
      const isTrending = m.trending === true || m.trending === 'true';

      const posterHtml = m.poster
        ? `<div class="poster-wrap">
             <img src="${escapeHtml(m.poster)}" alt="${escapeHtml(m.name)}" loading="lazy"
                  onerror="this.parentElement.innerHTML='<div class=\\'no-poster\\'>🎬</div><span class=\\'quality-float\\'>🎞️ ${escapeHtml(m.quality || 'HD')}</span>'">
             <span class="quality-float">🎞️ ${escapeHtml(m.quality || 'HD')}</span>
             ${isTrending ? '<span class="trending-float">🔥 TRENDING</span>' : ''}
           </div>`
        : `<div class="poster-wrap">
             <div class="no-poster">🎬</div>
             <span class="quality-float">🎞️ ${escapeHtml(m.quality || 'HD')}</span>
             ${isTrending ? '<span class="trending-float">🔥 TRENDING</span>' : ''}
           </div>`;

      const yearBadge = m.year ? `<span class="mini-badge badge-year">📅 ${escapeHtml(m.year)}</span>` : '';
      const ratingBadge = m.rating ? `<span class="mini-badge badge-rating">⭐ ${escapeHtml(m.rating)}</span>` : '';

      div.innerHTML = `
        ${posterHtml}
        <button class="fav-btn ${isFav ? 'active' : ''}" data-id="${m.id}" title="${isFav ? 'Remove from favorites' : 'Add to favorites'}">
          ${isFav ? '❤️' : '🤍'}
        </button>
        <div class="item-body">
          <div class="item-name">${escapeHtml(m.name)}</div>
          <div class="badges">
            <span class="mini-badge badge-lang">🌐 ${escapeHtml(m.lang || 'N/A')}</span>
            ${yearBadge}
            ${ratingBadge}
          </div>
          <div class="item-desc">${escapeHtml(m.desc || 'No description available.')}</div>
          <a class="btn-download" href="${escapeHtml(m.link)}" target="_blank" rel="noopener" download>
            ⬇️ DOWNLOAD
          </a>
        </div>
      `;

      // Favorite toggle
      div.querySelector('.fav-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        toggleFavorite(m.id, e.currentTarget);
      });

      listDiv.appendChild(div);
    });
  }

  // ---------- Toggle Favorite ----------
  function toggleFavorite(id, btn) {
    const idx = favorites.indexOf(id);
    if (idx > -1) {
      favorites.splice(idx, 1);
      btn.classList.remove('active');
      btn.textContent = '🤍';
      showToast('💔 Removed from favorites', 'linear-gradient(135deg, #ef4444, #b91c1c)');
    } else {
      favorites.push(id);
      btn.classList.add('active');
      btn.textContent = '❤️';
      showToast('❤️ Added to favorites!', 'linear-gradient(135deg, #ec4899, #be185d)');
    }
    localStorage.setItem('favMovies', JSON.stringify(favorites));
    setTimeout(applyFilters, 200);
  }

  // ---------- Escape HTML ----------
  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text || '';
    return div.innerHTML;
  }
</script>

</body>
