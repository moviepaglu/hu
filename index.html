<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎬 Movie Download Hub</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family: system-ui, Arial, sans-serif; }
  body { background: linear-gradient(145deg, #0f172a, #1e293b); min-height:100vh; padding:20px; color:#e2e8f0; }
  .container { max-width: 1200px; margin:0 auto; }

  .header {
    text-align:center; margin-bottom:30px; padding:32px 20px;
    background: rgba(30,41,59,0.7); border-radius:24px;
    border:1px solid #334155;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    position: relative; overflow: hidden;
  }
  .header::before {
    content:''; position:absolute; top:-50%; left:-50%; width:200%; height:200%;
    background: radial-gradient(circle, rgba(56,189,248,0.15) 0%, transparent 60%);
    animation: pulse 4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100% { transform: scale(1); opacity: 0.5; }
    50% { transform: scale(1.1); opacity: 0.8; }
  }
  .header h1 {
    font-size:34px; position:relative;
    background: linear-gradient(135deg, #38bdf8, #a78bfa, #f472b6);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    font-weight: 800;
  }
  .header .sub { color:#94a3b8; font-size:14px; margin-top:10px; position:relative; }

  .search-bar { max-width: 500px; margin: 20px auto 0; position: relative; }
  .search-bar input {
    width:100%; padding: 13px 18px 13px 45px;
    border-radius: 12px; border: 2px solid #334155;
    background: #0f172a; color: #fff; font-size: 14px;
    outline: none; transition: 0.2s;
  }
  .search-bar input:focus { border-color: #38bdf8; box-shadow: 0 0 0 3px rgba(56,189,248,0.2); }
  .search-bar::before {
    content: '🔍'; position: absolute; left: 15px; top: 50%;
    transform: translateY(-50%); font-size: 16px; pointer-events: none;
  }

  .card {
    background: rgba(30,41,59,0.8); border-radius:24px;
    padding:28px; border:1px solid #334155;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  }
  .card-title {
    font-size: 20px; margin-bottom: 20px; color:#f1f5f9;
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; flex-wrap: wrap;
  }
  .card-title .left {
    display: flex; align-items: center; gap: 10px;
    border-left: 4px solid #38bdf8; padding-left: 12px;
  }
  .count-badge {
    background: linear-gradient(135deg, #38bdf8, #a78bfa);
    color:#fff; padding:4px 14px; border-radius:20px;
    font-size:12px; font-weight:700;
  }

  .movie-list {
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 20px;
  }

  .movie-item {
    background: #0f172a; border: 1px solid #334155;
    border-radius: 18px; overflow: hidden;
    transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex; flex-direction: column; cursor: pointer;
  }
  .movie-item:hover {
    border-color: #38bdf8; transform: translateY(-8px);
    box-shadow: 0 25px 40px -15px rgba(56,189,248,0.3);
  }

  .poster-wrap {
    width:100%; aspect-ratio: 2/3;
    background: #1e293b; overflow: hidden; position: relative;
  }
  .poster-wrap img {
    width:100%; height:100%; object-fit: cover;
    display: block; transition: 0.4s;
  }
  .movie-item:hover .poster-wrap img { transform: scale(1.08); }
  .no-poster {
    width:100%; height:100%; display:flex; align-items:center;
    justify-content:center; font-size:60px; color:#475569;
  }

  .quality-float {
    position: absolute; top: 10px; right: 10px;
    background: rgba(6, 95, 70, 0.95);
    color: #6ee7b7; padding: 4px 10px;
    border-radius: 20px; font-size: 10px;
    font-weight: 800; letter-spacing: 0.5px;
    backdrop-filter: blur(4px);
    border: 1px solid rgba(110, 231, 183, 0.3);
  }

  .item-body { padding: 14px; flex:1; display: flex; flex-direction: column; }
  .item-name {
    font-weight: 700; color: #f1f5f9; font-size: 15px;
    margin-bottom: 10px; line-height: 1.3;
    display: -webkit-box; -webkit-line-clamp: 2;
    -webkit-box-orient: vertical; overflow: hidden;
    min-height: 40px;
  }

  .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .mini-badge { font-size: 10px; padding: 4px 10px; border-radius: 20px; font-weight: 700; }
  .badge-lang { background: #1e40af; color: #bfdbfe; }

  .item-desc {
    font-size: 12px; color: #94a3b8; line-height: 1.5;
    margin-bottom: 14px; flex: 1;
    display: -webkit-box; -webkit-line-clamp: 3;
    -webkit-box-orient: vertical; overflow: hidden;
  }

  .btn-download {
    background: linear-gradient(135deg, #10b981, #059669);
    color: #fff; border: none;
    padding: 12px 16px; border-radius: 12px;
    font-weight: 700; font-size: 14px;
    cursor: pointer; text-decoration: none;
    display: flex; align-items: center;
    justify-content: center; gap: 6px;
    transition: 0.2s; width: 100%;
  }
  .btn-download:hover { transform: scale(1.03); box-shadow: 0 10px 25px rgba(16,185,129,0.4); }
  .btn-download:active { transform: scale(0.98); }

  .empty, .loading {
    text-align: center; padding: 60px 20px;
    color: #64748b; font-size: 14px; grid-column: 1/-1;
  }
  .empty-icon { font-size: 64px; margin-bottom: 15px; display: block; opacity: 0.6; }
  .empty h3 { color: #cbd5e1; font-size: 18px; margin-bottom: 6px; font-weight: 600; }

  .footer {
    text-align: center; margin-top: 30px;
    font-size: 12px; color: #64748b;
    padding: 20px 0; border-top: 1px solid #334155;
  }

  .spinner {
    display: inline-block; width: 30px; height: 30px;
    border: 3px solid #334155; border-top-color: #38bdf8;
    border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: #0f172a; }
  ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
  ::-webkit-scrollbar-thumb:hover { background: #475569; }

  @media(max-width: 500px) {
    h1 { font-size: 24px !important; }
    .movie-list { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
    .card { padding: 18px; }
    .item-name { font-size: 13px; min-height: 34px; }
    .item-desc { font-size: 11px; -webkit-line-clamp: 2; }
    .btn-download { font-size: 12px; padding: 10px 12px; }
  }
</style>
</head>
<body>

<div class="container">

  <div class="header">
    <h1>🎬 Movie Download Hub</h1>
    <p class="sub">Free HD movies · No login · Instant download</p>
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Search movie...">
    </div>
  </div>

  <div class="card">
    <div class="card-title">
      <div class="left">📥 Available Movies</div>
      <span class="count-badge" id="countBadge">0 Movies</span>
    </div>
    <div class="movie-list" id="movieList">
      <div class="loading">
        <div class="spinner"></div>
        <div>Loading movies...</div>
      </div>
    </div>
  </div>

  <div class="footer">⚡ Powered by Firebase · Live updates</div>

</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, onValue }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  // 🔥 NAYA Firebase Config (abod-df454)
  const firebaseConfig = {
    apiKey: "AIzaSyC6bvaho6e-55XSPeW92e6CMviuj6WCqA8",
    authDomain: "abod-df454.firebaseapp.com",
    databaseURL: "https://abod-df454-default-rtdb.firebaseio.com",
    projectId: "abod-df454",
    storageBucket: "abod-df454.firebasestorage.app",
    messagingSenderId: "962090759544",
    appId: "1:962090759544:web:2a0da10cf441a6f3ff848d",
    measurementId: "G-RGMRXYXNPM"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const moviesRef = ref(db, 'movies');

  let allMovies = [];

  // ---------- Search ----------
  const searchInput = document.getElementById('searchInput');
  searchInput.addEventListener('input', (e) => {
    const query = e.target.value.toLowerCase().trim();
    const filtered = query
      ? allMovies.filter(m =>
          (m.name || '').toLowerCase().includes(query) ||
          (m.lang || '').toLowerCase().includes(query) ||
          (m.quality || '').toLowerCase().includes(query)
        )
      : allMovies;
    renderMovies(filtered);
  });

  // ---------- Realtime Listener ----------
  onValue(moviesRef, (snapshot) => {
    const data = snapshot.val();

    if (!data) {
      allMovies = [];
      document.getElementById('countBadge').textContent = '0 Movies';
      document.getElementById('movieList').innerHTML = `
        <div class="empty">
          <span class="empty-icon">🎞️</span>
          <h3>Abhi koi movie nahi hai</h3>
          <p>Thodi der baad check karo</p>
        </div>`;
      return;
    }

    allMovies = Object.entries(data)
      .map(([id, val]) => ({ id, ...val }))
      .sort((a, b) => (b.time || 0) - (a.time || 0));

    const query = searchInput.value.toLowerCase().trim();
    const filtered = query
      ? allMovies.filter(m =>
          (m.name || '').toLowerCase().includes(query) ||
          (m.lang || '').toLowerCase().includes(query) ||
          (m.quality || '').toLowerCase().includes(query)
        )
      : allMovies;

    renderMovies(filtered);
  });

  // ---------- Render Movies ----------
  function renderMovies(movies) {
    const listDiv = document.getElementById('movieList');
    const countBadge = document.getElementById('countBadge');

    countBadge.textContent = movies.length + ' Movie' + (movies.length !== 1 ? 's' : '');

    if (movies.length === 0) {
      listDiv.innerHTML = `
        <div class="empty">
          <span class="empty-icon">🔍</span>
          <h3>Koi movie nahi mili</h3>
          <p>Doosra naam try karo</p>
        </div>`;
      return;
    }

    listDiv.innerHTML = '';
    movies.forEach(m => {
      const div = document.createElement('div');
      div.className = 'movie-item';

      const posterHtml = m.poster
        ? `<div class="poster-wrap">
             <img src="${m.poster}" alt="${escapeHtml(m.name)}" loading="lazy">
             <span class="quality-float">🎞️ ${escapeHtml(m.quality || 'HD')}</span>
           </div>`
        : `<div class="poster-wrap">
             <div class="no-poster">🎬</div>
             <span class="quality-float">🎞️ ${escapeHtml(m.quality || 'HD')}</span>
           </div>`;

      div.innerHTML = `
        ${posterHtml}
        <div class="item-body">
          <div class="item-name">${escapeHtml(m.name)}</div>
          <div class="badges">
            <span class="mini-badge badge-lang">🌐 ${escapeHtml(m.lang || 'N/A')}</span>
          </div>
          <div class="item-desc">${escapeHtml(m.desc || 'No description available.')}</div>
          <a class="btn-download" href="${escapeHtml(m.link)}" target="_blank" rel="noopener" download>
            ⬇️ DOWNLOAD
          </a>
        </div>
      `;
      listDiv.appendChild(div);
    });
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text || '';
    return div.innerHTML;
  }
</script>

</body>
</html>
